name: Update card prices
on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update prices
        run: python scripts/update_prices.py
      - name: Commit prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet && echo "No price changes" && exit 0
          git commit -m "Update card prices"
          git push
